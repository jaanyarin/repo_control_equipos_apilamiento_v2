name: CI/CD

on:
  push:
    branches: [main, develop, refactor/mobile-react-native-cli]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: repo_control_equipos_apilamiento
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate JWT keys
        run: |
          openssl genrsa -out privatekey.pem 2048
          openssl rsa -pubout -in privatekey.pem -out publickey.pem
          mkdir -p backend/src/main/resources
          cp privatekey.pem backend/src/main/resources/
          cp publickey.pem backend/src/main/resources/

      - name: Build & Test Backend
        run: mvn clean verify -f backend/pom.xml
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/repo_control_equipos_apilamiento
          QUARKUS_DATASOURCE_USERNAME: postgres
          QUARKUS_DATASOURCE_PASSWORD: postgres
          OIDC_TENANT_ID: test
          OIDC_CLIENT_ID: test
          OIDC_CLIENT_SECRET: test
          JWT_PUBLIC_KEY: ''
          JWT_ISSUER: https://apilamiento.internal
          JWT_EXPIRATION: '3600'

  frontend:
    name: Frontend Web - Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --ext .js,.jsx

      - name: Test
        run: npx jest

      - name: Build
        run: npm run build

  mobile:
    name: Mobile - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --ext .js,.jsx

      - name: Test
        run: npx jest

  mobile-cli-bootstrap:
    name: Mobile CLI Bootstrap - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_cli_next

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile_cli_next/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-cli-bootstrap-debug-apk
          path: mobile_cli_next/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
