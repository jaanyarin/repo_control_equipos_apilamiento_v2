buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Workaround Gradle 8.14 FileAlreadyExistsException en problems-report.html
// https://github.com/gradle/gradle/issues/30762
task cleanProblemsReport(type: Delete) {
    delete "$buildDir/reports/problems"
}

afterEvaluate {
    tasks.matching { it.name.startsWith('assemble') }.configureEach {
        dependsOn cleanProblemsReport
    }
}
